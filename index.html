<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المطعم الناضج</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 8px;
            color: #f39c12;
        }
        p {
            color: #b0b0b0;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            border: 2px solid #f39c12;
            border-radius: 12px;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn:hover {
            background: #f39c12;
            color: #121212;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>المطعم الناضج</h1>
        <p>مرحباً بك، اختر الخدمة المطلوبة:</p>

        <!-- زر المنيو -->
        <a href="https://alnadegmenu.com/" class="btn" target="_blank">📖 تصفح المنيو الرقمي</a>

        <!-- زر التقييم -->
        <a href="https://maps.app.goo.gl/vLY8pNTr3kETtGKv9" class="btn" target="_blank">⭐ تقييمنا على جوجل ماب</a>

        <div class="footer">Powered by NFC</div>
    </div>

</body>
</html>
